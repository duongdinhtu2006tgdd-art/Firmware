; PlatformIO Project Configuration - Node 2 (ESP32 dieu khien he tuoi)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Ghim version platform de build khong bi vo khi PlatformIO cap nhat.
; 7.0.1 di kem Arduino core 2.0.17 (con ledcSetup/ledcAttachPin).
; Neu sau nay nang len core 3.x thi 2 API do bi bo, phai doi sang
; ledcAttach()/ledcWrite() trong hal_pwm.cpp.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -Wall
    -Wextra
